<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Ratings Collector</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --accent: #58a6ff; --accent2: #3fb950; --warn: #f78166;
    --text: #e6edf3; --muted: #8b949e; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; padding: 24px 16px 48px; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem, 5vw, 2.4rem); color: var(--text); line-height: 1.2; margin-bottom: 8px; }
  header p { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.05em; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; max-width: 560px; margin: 0 auto 20px; }
  label { display: block; font-size: 0.72rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  input[type="text"] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.82rem; padding: 12px 14px; outline: none; transition: border-color 0.2s; }
  input[type="text"]:focus { border-color: var(--accent); }
  .hint { font-size: 0.7rem; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .btn { display: block; width: 100%; max-width: 560px; margin: 0 auto; padding: 15px; background: var(--accent); color: #0d1117; border: none; border-radius: var(--radius); font-family: 'DM Mono', monospace; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.08em; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
  .btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-dl { background: var(--accent2); margin-top: 12px; display: none; }
  #progress-section { display: none; max-width: 560px; margin: 20px auto 0; }
  .progress-bar-wrap { background: var(--border); border-radius: 999px; height: 6px; overflow: hidden; margin-bottom: 14px; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; width: 0%; transition: width 0.4s ease; }
  .log { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; height: 200px; overflow-y: auto; font-size: 0.72rem; line-height: 1.8; color: var(--muted); }
  .log .ok   { color: var(--accent2); }
  .log .info { color: var(--accent); }
  .log .warn { color: var(--warn); }
  #results-section { display: none; max-width: 560px; margin: 20px auto 0; }
  .stat-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
  .stat .num { font-size: 1.6rem; font-family: 'Playfair Display', serif; color: var(--accent); }
  .stat .lbl { font-size: 0.65rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
  th { background: var(--surface); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.65rem; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid #21262d; vertical-align: top; line-height: 1.4; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1c2128; }
  .rating-val { color: var(--accent2); font-weight: 500; }
  .no-rating  { color: var(--muted); font-style: italic; }
  .stars { color: #e3b341; letter-spacing: -1px; font-size: 0.75rem; }
  #map { width: 1px; height: 1px; position: fixed; top: -9999px; left: -9999px; }
</style>
</head>
<body>

<header>
  <h1>Hospital Ratings Collector</h1>
  <p>BALTIMORE &amp; WASHINGTON DC · 50-MILE RADIUS · GOOGLE PLACES</p>
</header>

<div class="card">
  <label for="apiKey">Google Places API Key</label>
  <input type="text" id="apiKey" placeholder="Paste your API key here…" autocomplete="off" spellcheck="false">
  <p class="hint">Your key calls Google's API directly — never sent anywhere else.</p>
</div>

<button class="btn" id="runBtn" onclick="startCollection()">▶ &nbsp;Collect Hospital Ratings</button>
<button class="btn btn-dl" id="dlBtn" onclick="downloadCSV()">⬇ &nbsp;Download CSV</button>

<div id="progress-section">
  <div class="card" style="padding:16px 20px 20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:0.72rem;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase">Progress</span>
      <span id="pct" style="font-size:0.72rem;color:var(--accent)">0%</span>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar"></div></div>
    <div class="log" id="log"></div>
  </div>
</div>

<div id="results-section">
  <div class="stat-row">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Hospitals</div></div>
    <div class="stat"><div class="num" id="statRated">0</div><div class="lbl">With Ratings</div></div>
    <div class="stat"><div class="num" id="statAvg">—</div><div class="lbl">Avg Rating</div></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Hospital</th><th>Rating</th><th># Reviews</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div id="map"></div>

<script>
  const CENTERS = [
    { name: "Baltimore",     lat: 39.2904, lng: -76.6122 },
    { name: "Washington DC", lat: 38.9072, lng: -77.0369 },
  ];
  const RADIUS_M = 80467;
  let service, csvData = [];

  function log(msg, cls = "") {
    const el = document.getElementById("log");
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = msg;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  function setProgress(pct) {
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("pct").textContent = Math.round(pct) + "%";
  }

  function stars(r) {
    const full = Math.round(r);
    return "★".repeat(full) + "☆".repeat(5 - full);
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function loadMapsAPI(apiKey) {
    return new Promise((resolve, reject) => {
      const old = document.getElementById("gmaps-script");
      if (old) old.remove();

      window.__mapsReady = () => {
        try {
          const map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 39, lng: -77 }, zoom: 8
          });
          service = new google.maps.places.PlacesService(map);
          resolve();
        } catch(e) { reject(e); }
      };

      const script = document.createElement("script");
      script.id = "gmaps-script";
      script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places&callback=__mapsReady`;
      script.onerror = () => reject(new Error(
        "Could not load Google Maps API. Check that your API key is correct " +
        "and that Maps JavaScript API and Places API are enabled."
      ));
      document.head.appendChild(script);
    });
  }

  // Search one page; resolves with { results, status, pagination }
  function searchPage(requestOrPagination, isNextPage) {
    return new Promise((resolve, reject) => {
      const TIMEOUT_MS = 15000;
      let settled = false;

      const timer = setTimeout(() => {
        if (!settled) {
          settled = true;
          // Treat a timeout on pagination as "no more pages" rather than an error
          if (isNextPage) resolve({ results: [], status: "TIMEOUT", pagination: null });
          else reject(new Error("Search timed out. Please try again."));
        }
      }, TIMEOUT_MS);

      const callback = (results, status, pagination) => {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          resolve({ results: results || [], status, pagination });
        }
      };

      if (isNextPage) {
        requestOrPagination.nextPage();
        // nextPage re-fires the original callback — but we need to register
        // a fresh one via another nearbySearch isn't possible, so we rely on
        // the fact that nextPage will call back into the service's internal
        // handler. We instead re-register by replacing the service reference.
        // Simpler: just do another nearbySearch with the stored token approach.
        // See note below — we handle this differently.
      } else {
        service.nearbySearch(requestOrPagination, callback);
      }
    });
  }

  // Collect all place IDs for one center using manual token tracking
  async function collectCenter(center) {
    const places = new Map();
    let pageNum = 1;

    // We use a self-contained callback approach to handle pagination reliably
    const doSearch = (request) => new Promise((resolve, reject) => {
      let settled = false;
      const timer = setTimeout(() => {
        if (!settled) { settled = true; resolve({ results: [], status: "TIMEOUT", pagination: null }); }
      }, 12000);

      service.nearbySearch(request, (results, status, pagination) => {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          resolve({ results: results || [], status, pagination });
        }
      });
    });

    const doNextPage = (pagination) => new Promise((resolve) => {
      let settled = false;
      const timer = setTimeout(() => {
        if (!settled) { settled = true; resolve({ results: [], status: "TIMEOUT", pagination: null }); }
      }, 12000);

      // Re-register callback by wrapping nextPage
      // The Places API reuses the same callback slot
      const originalSearch = service.nearbySearch.bind(service);
      service.nearbySearch = (req, cb) => {
        service.nearbySearch = originalSearch; // restore immediately
        // This won't be called for nextPage — instead nextPage calls back
        // through the internal handler. We use a polling approach instead:
      };
      service.nearbySearch = originalSearch;

      // Cleanest approach: use a one-time listener via a temporary service swap
      // Actually the most reliable: just call nextPage and intercept via
      // a new nearbySearch wrapper
      let tempService = service;
      tempService.nearbySearch = function(req, cb) {
        // Ignore — nextPage doesn't call nearbySearch
      };

      // The real solution: nearbySearch callback IS reused by nextPage internally
      // We create a new PlacesService to get a clean callback slot
      // But that's complex. Instead: wrap nextPage's implicit callback.

      // ACTUAL RELIABLE APPROACH: Don't use nextPage at all.
      // Google returns up to 60 results (3 pages of 20) for nearby search.
      // We just accept the first page (20 results) and move on.
      // For our use case this still gives us 20+ hospitals per center.
      if (!settled) {
        settled = true;
        clearTimeout(timer);
        resolve({ results: [], status: "DONE", pagination: null });
      }
    });

    log(`  Searching near ${center.name}…`, "info");
    const { results, status, pagination } = await doSearch({
      location: new google.maps.LatLng(center.lat, center.lng),
      radius: RADIUS_M,
      type: "hospital",
    });

    if (status === "REQUEST_DENIED") {
      throw new Error("API key denied. Make sure Maps JavaScript API and Places API are both enabled and added to your key's API restrictions.");
    }
    if (!["OK", "ZERO_RESULTS"].includes(status)) {
      log(`  Warning: ${status}`, "warn");
      return places;
    }

    results.forEach(r => places.set(r.place_id, r));
    log(`  Page 1: +${results.length} hospitals`, "ok");

    // Attempt additional pages with a robust timeout-protected approach
    if (pagination && pagination.hasNextPage) {
      for (let p = 2; p <= 3; p++) {
        log(`  Waiting before page ${p}…`);
        await sleep(3000); // Google requires ~2s before nextPage

        const nextResults = await new Promise((resolve) => {
          let done = false;
          const timer = setTimeout(() => {
            if (!done) { done = true; resolve([]); }
          }, 10000);

          try {
            pagination.nextPage();
            // nextPage fires back through a shared callback mechanism.
            // We intercept by temporarily overriding nearbySearch on the service.
            // This is the only reliable cross-browser way to catch it.
            const origFn = service.nearbySearch.bind(service);
            // Poll for new results added to places map (indirect detection)
            // Since we can't easily intercept, use a 3s wait and re-query
            setTimeout(() => {
              if (!done) {
                done = true;
                clearTimeout(timer);
                resolve("skip");
              }
            }, 3500);
          } catch(e) {
            if (!done) { done = true; clearTimeout(timer); resolve([]); }
          }
        });

        if (nextResults === "skip" || !nextResults || nextResults.length === 0) {
          log(`  No more pages available.`, "");
          break;
        }
        nextResults.forEach(r => places.set(r.place_id, r));
        log(`  Page ${p}: +${nextResults.length} hospitals`, "ok");
      }
    }

    return places;
  }

  function doGetDetails(placeId) {
    return new Promise(resolve => {
      service.getDetails(
        { placeId, fields: ["name", "formatted_address", "rating", "user_ratings_total"] },
        (result, status) => resolve(status === "OK" ? result : null)
      );
    });
  }

  async function startCollection() {
    const key = document.getElementById("apiKey").value.trim();
    if (!key) { alert("Please enter your API key first."); return; }

    document.getElementById("runBtn").disabled = true;
    document.getElementById("dlBtn").style.display = "none";
    document.getElementById("results-section").style.display = "none";
    document.getElementById("progress-section").style.display = "block";
    document.getElementById("log").innerHTML = "";
    document.getElementById("tableBody").innerHTML = "";
    setProgress(0);
    csvData = [];

    try {
      log("Loading Google Maps API…", "info");
      await loadMapsAPI(key);
      log("Google Maps API loaded ✓", "ok");

      // Use a simpler, proven pagination approach:
      // nearbySearch with callback that handles all pages internally
      const allPlaces = new Map();

      for (const center of CENTERS) {
        log(`Searching near ${center.name}…`, "info");
        await new Promise((resolve, reject) => {
          const request = {
            location: new google.maps.LatLng(center.lat, center.lng),
            radius: RADIUS_M,
            type: "hospital",
          };

          let pageNum = 1;

          const handleResults = (results, status, pagination) => {
            if (status === "REQUEST_DENIED") {
              reject(new Error("API key denied. Check that Maps JavaScript API and Places API are enabled and added to your key's API restrictions."));
              return;
            }
            if (!["OK", "ZERO_RESULTS"].includes(status)) {
              log(`  Warning: ${status}`, "warn");
              resolve();
              return;
            }

            (results || []).forEach(r => allPlaces.set(r.place_id, r));
            log(`  Page ${pageNum}: +${(results||[]).length} hospitals (${allPlaces.size} unique total)`, "ok");
            pageNum++;

            if (pagination && pagination.hasNextPage) {
              log(`  Fetching next page…`);
              setTimeout(() => pagination.nextPage(), 2500);
            } else {
              resolve();
            }
          };

          service.nearbySearch(request, handleResults);
        });
      }

      log(`\nTotal unique hospitals found: ${allPlaces.size}`, "info");
      const ids = [...allPlaces.keys()];

      const hospitals = [];
      for (let i = 0; i < ids.length; i++) {
        setProgress(10 + (i / ids.length) * 87);
        const det = await doGetDetails(ids[i]);
        if (det) {
          hospitals.push({
            name:    det.name || "(unknown)",
            address: det.formatted_address || "",
            rating:  det.rating != null ? det.rating : "",
            reviews: det.user_ratings_total != null ? det.user_ratings_total : "",
          });
          log(`  [${i+1}/${ids.length}] ${det.name}`);
        }
        await sleep(60);
      }

      hospitals.sort((a, b) => a.name.localeCompare(b.name));
      setProgress(100);
      csvData = hospitals;

      const rated = hospitals.filter(h => h.rating !== "");
      const avg = rated.length
        ? (rated.reduce((s, h) => s + Number(h.rating), 0) / rated.length).toFixed(2)
        : "—";

      document.getElementById("statTotal").textContent = hospitals.length;
      document.getElementById("statRated").textContent = rated.length;
      document.getElementById("statAvg").textContent   = avg;

      const tbody = document.getElementById("tableBody");
      hospitals.forEach(h => {
        const tr = document.createElement("tr");
        const ratingCell = h.rating !== ""
          ? `<span class="rating-val">${h.rating}</span> <span class="stars">${stars(h.rating)}</span>`
          : `<span class="no-rating">n/a</span>`;
        tr.innerHTML = `
          <td>${h.name}<br><span style="color:var(--muted);font-size:0.65rem">${h.address}</span></td>
          <td>${ratingCell}</td>
          <td>${h.reviews !== "" ? Number(h.reviews).toLocaleString() : '<span class="no-rating">n/a</span>'}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("results-section").style.display = "block";
      document.getElementById("dlBtn").style.display = "block";
      log(`\n✅ Done! ${hospitals.length} hospitals collected.`, "ok");

    } catch (err) {
      log("❌ " + err.message, "warn");
    } finally {
      document.getElementById("runBtn").disabled = false;
    }
  }

  function downloadCSV() {
    if (!csvData.length) return;
    const header = ["Name", "Address", "Rating", "Total Reviews"];
    const rows = csvData.map(h => [
      `"${h.name.replace(/"/g, '""')}"`,
      `"${h.address.replace(/"/g, '""')}"`,
      h.rating,
      h.reviews,
    ]);
    const csv = [header, ...rows].map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "hospital_ratings.csv";
    a.click();
  }
</script>
</body>
</html>
